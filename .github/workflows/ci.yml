name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # 端到端冒烟：sql.js 内存库，无需 MySQL/Redis/Docker
      - name: 端到端测试
        run: npm run test:e2e
      # 启动冒烟（同样走 sqlite 内存库）
      - name: 启动并检查 Swagger
        run: |
          cp .env.example .env
          npm run start:prod &
          SERVER_PID=$!
          sleep 8
          curl -f http://localhost:${{ env.PORT || 3000 }}/docs || true
          kill $SERVER_PID || true
