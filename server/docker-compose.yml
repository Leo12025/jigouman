version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: jigouman-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: jigouman
      MYSQL_CHARSET: utf8mb4
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: jigouman-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mysql_data:
